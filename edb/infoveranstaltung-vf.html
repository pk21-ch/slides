            ---

            <!-- .slide: class="content-layout" -->
            <p class="eyebrow">Bewertung in PkOrg</p>

            ## So wird Deine Bewertung nachvollziehbar.

            <div class="slide-content">
              <ul>
                <li class="fragment">Bewerte Fachkompetenz, Projektmanagement und Dokumentation anhand der Kriterien.</li>
                <li class="fragment">Wähle die Gütestufe 0 bis 3 passend zur Anzahl erfüllter Leitfragen.</li>
                <li class="fragment">Begründe jede Punktevergabe mit konkreten Beobachtungen und Nachweisen aus den Lieferobjekten.</li>
                <li class="fragment">Besprich unterschiedliche Einschätzungen im Bewertungsgespräch. Ohne Konsens entscheidet die Notenkonferenz.</li>
                <li class="fragment">Signiere die Bewertung der ersten drei Teilbereiche in der Regel innerhalb von sieben Tagen nach IPA-Abgabe.</li>
              </ul>
            </div>

            ---

            <!-- .slide: class="content-layout" -->
            <p class="eyebrow">Bewertung</p>

            ## An einem Beispiel erklärt, wie Kriterien funktionieren.

            <div class="slide-content">
              <table style="width: 100%; font-size: 0.95em; line-height: 1.15;" class="fragment">
                <tbody>
                  <tr>
                    <th scope="row" style="width: 14%;">A04</th>
                    <th scope="col">Meetings/Workshops planen und moderieren</th>
                  </tr>
                  <tr class="fragment">
                    <th scope="row">Gütestufe 3</th>
                    <td>
                      <ol>
                        <li>Meetings und Workshops sind geplant (z. B. Ziele, Dauer, Teilnehmende, Ressourcen, Infrastruktur, Budget) und die Notwendigkeit der Teilnehmenden ist begründet.</li>
                        <li>Alle Teilnehmer werden mit Absichtserklärung (z. B. Zielen, Ablauf, Traktanden, Voraussetzungen, benötigte Hilfsmittel) vorgängig eingeladen.</li>
                        <li>Die benötigte Infrastruktur (z. B. Raum, Technik) wurde vorbereitet und während der Durchführung professionell bedient (z. B. Vollbildmodus bei Präsentationen, Anpassen der Lichtverhältnisse, angepasste Sprechlautstärke).</li>
                        <li>Eine auf die Teilnehmer abgestimmte Moderationstechnik wird professionell eingesetzt.</li>
                      </ol>
                    </td>
                  </tr>
                  <tr class="fragment">
