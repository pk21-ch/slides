            ## Die Schritte bis zur Abgabe.

            <div class="slide-content">
              <ol class="timeline fragment" data-fragment-index="1">
                <li><h3>Beginn</h3><p>Die KAND beginnt mit der Umsetzung zum festgelegten Startzeitpunkt, <strong>nicht früher.</strong></p></li>
                <li class="fragment" data-fragment-index="2"><h3>Erstbesuch (max. 1h)</h3><p>Der HEX und der NEX besuchen Dich und die KAND. Die KAND stellt die <strong>Planung und erste Ergebnisse</strong> vor. Allfällige Fragen werden geklärt.</p></li>
                <li class="fragment" data-fragment-index="3"><h3>Zwischenbesuch (max. 1h)</h3><p>Der HEX und der NEX besuchen Dich und die KAND erneut, um den Fortschritt zu überprüfen. Es werden weitere <strong>Zwischenergebnisse</strong> vorgestellt und Lieferobjekte besprochen.</p></li>
                <li class="fragment" data-fragment-index="4"><h3>Abgabe</h3><p>Die KAND gibt die Lieferobjekte fristgerecht <strong>am 10. Tag bis 18:00 Uhr</strong> auf PkOrg ab.</p></li>
              </ol>
              <aside class="callout fragment">Während der Durchführung hältst Du Ereignisse und Hilfestellungen in einem Beobachtungsprotokoll fest.</aside>
            </div>

            ## Einsatz von generierten Inhalten

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li>Hilfen durch künstliche Intelligenz dürfen verwendet werden, sofern sie in der detaillierten Aufgabenstellung unter «Mittel und Methoden» oder durch die KAND im Arbeitsjournal als Fremdleistung aufgeführt werden.</li>
                    <li>Generierte Inhalte müssen klar gekennzeichnet und nachvollziehbar belegt werden, zum Beispiel im Quellenverzeichnis oder in Fussnoten.</li>
                    <li><strong>Die nicht deklarierte oder unreflektierte Nutzung generierter Inhalte führt zu Punktabzug.</strong></li>
                  </ul>

            ## Wie die Präsentation verläuft.

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li class="fragment">Die KAND präsentiert ihre Ergebnisse <strong>15 bis 20 Minuten</strong> lang in Mundart oder Schriftsprache.</li>
                    <li class="fragment">Es sollen Schwerpunkte auf die wichtigsten Erkenntnisse oder Probleme gesetzt und dadurch ein <strong>«Blick hinter die Kulissen»</strong> ermöglicht werden.</li>
                    <li class="fragment">Die Präsentation ist die Show der KAND. Es sollen <strong>keine Fragen</strong> gestellt oder die KAND anderweitig unterbrochen werden.</li>
                  </ul>
                </div>

            ## «Fachsimpeln» über die Arbeit.

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li>Das Fachgespräch dauert zwischen <strong>30 und 40 Minuten</strong>. Dabei werden <strong>vier Themenkomplexe</strong> behandelt.</li>
                    <li class="fragment">Es geht darum herauszufinden, ob sich mit der KAND auf <strong>professionellem Niveau über ihre Arbeit «fachsimpeln»</strong> lässt.</li>
                    <li class="fragment"><strong>Stelle sicher, dass du gut vorbereitet bist.</strong> Das Expertenteam führt das Gespräch. Das Expertenteam ist dankbar, wenn du ein paar Vorschläge für Themen oder Fragen bis 3 Tage vorher einreichst.</li>
