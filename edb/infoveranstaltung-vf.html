            <div class="slide-content">
              <ol class="timeline fragment" data-fragment-index="1">
                <li><h3>Auftrag konkretisieren</h3><p>Beschreibe Ausgangslage, Problemstellung und erwartete Arbeit, ohne die Lösung vorwegzunehmen.</p></li>
                <li class="fragment" data-fragment-index="2"><h3>Kriterien und Zeitplan</h3><p>Definiere drei individuelle Kriterien und plane die Arbeit in realistischen Halbtages-Schritten.</p></li>
                <li class="fragment" data-fragment-index="3"><h3>Abstimmen und signieren</h3><p>Besprich die Detailaufgabe mit der kandidierenden Person. Beide Signaturen lösen den nächsten Schritt in PkOrg aus.</p></li>
                <li class="fragment" data-fragment-index="4"><h3>Validierung abschliessen</h3><p>Bearbeite Rückmeldungen des Validierungsteams zeitnah und stelle die Freigabe vor dem Start sicher.</p></li>
              </ol>
              <aside class="callout fragment" data-fragment-index="2">Die Aufgabe wird von der VF formuliert. Die kandidierende Person muss mit ihr einverstanden sein. Vereinbare den ersten HEX-Besuch nach Möglichkeit bereits in der Validierungsphase.</aside>

                <li class="fragment" data-fragment-index="2"><h3>Unterstützung protokollieren</h3><p>Notiere auch Hilfestellungen, durch wen sie erfolgten und in welchem Umfang.</p></li>
                <li class="fragment" data-fragment-index="3"><h3>Expertenbesuch koordinieren</h3><p>Stimme Besuchstermine frühzeitig mit HEX, NEX und kandidierender Person ab.</p></li>

                    <li class="fragment">Erfasse allfällige <strong>Hilfestellungen</strong>: Anlass, Inhalt, Umfang und beteiligte Personen.</li>

                <li class="fragment">Besprich unterschiedliche Einschätzungen im Bewertungsgespräch. Ohne Konsens entscheidet die Notenkonferenz.</li>
