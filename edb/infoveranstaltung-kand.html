            ## Wie die Präsentation verläuft.

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li class="fragment">Du präsentierst Deine Ergebnisse <strong>15 bis 20 Minuten</strong> lang in Mundart oder Schriftsprache.</li>
                    <li class="fragment">Setze Schwerpunkte auf die wichtigsten Erkenntnisse oder Probleme. Lass die Expertinnen und Experten einen <strong>Blick hinter die Kulissen</strong> werfen. Was nach der Abgabe mit Deiner Arbeit passiert ist, wäre eine interessante Anekdote zum Schluss.</li>
                    <li class="fragment">Gestalte die Präsentation <strong>abwechslungsreich</strong>, zum Beispiel mit einer Live-Demonstration.</li>
                  </ul>
                </div>
                <figure class="fragment" style="width: 400px; max-width: 100%;">

            ## «Fachsimpeln» über deine Arbeit.

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li class="fragment">Das Fachgespräch dauert zwischen <strong>30 und 40 Minuten</strong>. Dabei werden <strong>vier Themenkomplexe</strong> behandelt.</li>
                    <li class="fragment">Es geht darum herauszufinden, ob sich mit Dir auf <strong>professionellem Niveau über Deine Arbeit «fachsimpeln»</strong> lässt.</li>
                    <li class="fragment">Dabei gehst Du auf Fragen des Expertenteams ein und ziehst Deine Lieferobjekte zur Veranschaulichung bei.</li>
