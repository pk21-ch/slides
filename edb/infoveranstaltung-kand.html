            <div class="title-content">

              Registrierung, Vorbereitung und Eingabe der IPA

            </div>

            ---

            <!-- .slide: class="content-layout" -->
            <p class="eyebrow">Ablauf</p>

            ## Die Schritte bis zum Start.

            <div class="slide-content">
              <ol class="timeline">
                <li><h3>Registrierung (ab 25.11.)</h3><p>Registrierung auf der Prüfungsplattform.</p></li>
                <li class="fragment"><h3>Eingabe (bis 31.12.)</h3><p>Grobbeschreibung und Startblock eingeben.</p></li>
                <li class="fragment"><h3>Validierung (ab 4 Wochen vor dem Start)</h3><p>Detaillierte Aufgabenstellung ausarbeiten.</p></li>
                <li class="fragment"><h3>Freigabe (bis ein paar Tage vor dem Start</h3><p>VEX gibt deine IPA zur Umsetzung frei.</p></li>
              </ol>
              <aside class="callout">Kommuniziere proaktiv und halte die Termine ein.</aside>
            </div>

            ## Was Du vor der IPA vorbereitest.

                <img src="../lib/assets/icons/business/fingerprint.svg" alt="Registrierung">

                  <h3>Registrieren</h3>
                  <p>Ab dem <strong>25. November</strong> kannst du <strong>Dich</strong> auf der Prüfungsplattform <a href="https://pkorg.ch">pkorg.ch</a> <strong>registrieren</strong> und Deine <strong>verantwortliche Fachkraft</strong> einladen</strong>.</p>
                </div>
              </div>
              <div class="icon-list-item fragment">
                <img src="../lib/assets/icons/business/deadline.svg" alt="Termine einhalten">

                  <h3>Termine einhalten</h3>
                  <p>Notiere dir die Termine und führe eine Aufgabenliste.Hast Du Deine verantwortliche Fachkraft für den <strong>18. November</strong> aufgeboten?</p>
                </div>
              </div>
              <div class="icon-list-item fragment">
                <img src="../lib/assets/icons/education/book-1.svg" alt="Dokumente lesen">

                </div>

                </div>

            ## Die Suche nach dem passenden Thema.

            <div class="slide-content">
              <div class="two-cols">
                <div>
                  <h3>Zum Berufsbild passend</h3>
                  <ul>
                    <li>Daten analysieren</li>
                    <li>Evaluation von Schnittstellen und deren Beteiligten</li>
                    <li>Prozesse entwickeln, optimieren, vereinfachen und digitalisieren</li>
                    <li>Schulungen entwickeln und durchführen</li>
                  </ul>
                </div>
                <div class="fragment">
                  <h3>Zu Dir passend</h3>
                  <ul>
                    <li>Stärken und Bekanntes berücksichtigen</li>
                    <li>Aufbauend auf bisherigen oder aktuell laufenden Projekten</li>
                    <li>Etwas das für dich nicht komplett neu ist</li>
                    <li>Etwas was deinen Berufsalltag identifiziert</li>
                  </ul>
                </div>
              </div>

            ## Die Schritte bis zur Abgabe.

            <div class="slide-content">
              <ol class="timeline">
                <li><h3>Beginn</h3><p>Zum Startzeitpunkt beginnst Du mit der Umsetzung und nicht früher.</p></li>
                <li class="fragment"><h3>Erstbesuch</h3><p>Der HEX und NEX besuchen dich zu einem vereinbarten Termin. Du stellst deine Planung und ersten Ergebnisse vor. Allfällige Fragen werden geklärt.</p></li>
                <li class="fragment"><h3>Zwischenbesuch</h3><p>Der HEX und NEX besuchen dich erneut, um den Fortschritt zu überprüfen. Du demonstrierst bisherige Ergebnisse.</p></li>
                <li class="fragment"><h3>Abgabe</h3><p>Du gibst deine Lieferobjekte fristgerecht <strong>am 10. Tag bis 18:00:00 Uhr</strong> auf PkOrg ab.</p></li>
              </ol>
              <aside class="callout">Organisiere die Besuchstermine mit allen Beteiligten frühzeitig. <strong>Du bist im Lead!</strong></aside>
            </div>

                    <li>Generierte Inhalte müssen klar nachvollziehbar gekennzeichnet (Quellenverzeichnis, Fussnoten, ...) sein.</li>
                    <li><strong>Nicht deklarierte und unreflektierte Nutzung von generierten Inhalten führt zu Punkteabzug.</strong></li>
