                <li class="fragment" data-fragment-index="2"><h3>Präsentation</h3><p>Du präsentierst deine Ergebnisse vor VF, HEX und NEX.</p></li>
                <li class="fragment" data-fragment-index="3"><h3>Fachgespräch</h3><p>Während des Fachgesprächs erläuterst du deine Vorgehensweise, Entscheidungen und Ergebnisse gezielt zu Fragen des Expertenteams.</p></li>

            <!-- .slide: class="content-layout" -->

            ## Wie die Präsentation verläuft.

            <div class="slide-content">
              <div class="image-text">
                <div>
                  <ul>
                    <li class="fragment">Du präsentierst <strong>15 bis 20 Minuten</strong> in Mundart oder Schriftsprache deine Ergebnisse.</li>
                    <li class="fragment">Setze Schwerpunkte auf die wichtigsten Erkenntnisse oder Probleme. Lass die Experten einen <strong>Blick auf «behind the scenes»</strong> werfen. Was nach der Abgabe mit deiner Arbeit passierte, wäre eine interessante Anekdote zum Schluss.</li>
                    <li class="fragment">Gestalte die Präsentation <strong>abwechslungsreich</strong>, zum Beispiel mit einer Live-Demonstration.</li>
                  </ul>
                </div>
                <figure class="fragment">
                  <img src="./assets/presentation.jpg" width="768" height="432" style="height: 400px;" alt="Symbolbild">

                    <td>
